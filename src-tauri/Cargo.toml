[package]
name = "wolfdeck"
version = "0.1.0"
description = "A modern front end for WolfcamQL: demo library, frag finder, live remote and batch capture"
authors = ["WolfDeck contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "wolfdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
dirs = "6"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The demo parser is bit-twiddling heavy; keep it fast in dev builds too.
[profile.dev.package.wolfdeck]
opt-level = 1
