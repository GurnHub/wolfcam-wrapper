[package]
name = "wolfcam-wrapper"
version = "0.2.0"
description = "Demo library and highlight finder for WolfcamQL, with clip rendering and config and key editors"
authors = ["Wolfcam Wrapper contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "wolfcam_wrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
dirs = "6"
trash = "5"
fs4 = "0.13"
zip = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The demo parser is bit-twiddling heavy; keep it fast in dev builds too.
[profile.dev.package.wolfcam-wrapper]
opt-level = 1

