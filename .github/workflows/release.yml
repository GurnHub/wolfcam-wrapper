name: release

# Pushing a tag such as v0.1.0 or v0.1.0-alpha.1 builds the installers on
# all three platforms and publishes them as a GitHub release. Tags with a
# pre-release suffix (-alpha, -beta, -rc) are marked as pre-releases.
# The release text is taken from docs/releases/<tag>.md when that file exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            bundles: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums and release text
        id: prep
        shell: bash
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "WolfDeck ${GITHUB_REF_NAME}" > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          name="WolfDeck ${GITHUB_REF_NAME#v}"
          name="${name/-alpha./ alpha }"; name="${name/-beta./ beta }"; name="${name/-rc./ release candidate }"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.prep.outputs.name }}
          body_path: ${{ steps.prep.outputs.notes }}
          prerelease: ${{ steps.prep.outputs.prerelease }}
          files: dist-release/*
          fail_on_unmatched_files: true
