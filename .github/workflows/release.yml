name: release

# Builds the Windows and Linux installers and publishes them as a
# GitHub release. Start it either by pushing a tag such as v0.1.0, or from
# the Actions tab ("Run workflow") with the version tag to create; the tag
# is then created on the commit the workflow ran on. Tags with a pre-release
# suffix (-alpha, -beta, -rc) are marked as pre-releases. The release text
# is taken from docs/releases/<tag>.md when that file exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v0.1.0-alpha.1"
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like vX.Y.Z or vX.Y.Z-suffix
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid tag: $TAG"; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums and release text
        id: prep
        shell: bash
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "WolfDeck ${TAG}" > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          name="WolfDeck ${TAG#v}"
          name="${name/-alpha./ alpha }"; name="${name/-beta./ beta }"; name="${name/-rc./ release candidate }"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Only used when the tag does not exist yet (manual runs).
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prep.outputs.name }}
          body_path: ${{ steps.prep.outputs.notes }}
          prerelease: ${{ steps.prep.outputs.prerelease }}
          files: dist-release/*
          fail_on_unmatched_files: true
